name: serb_tracker_client
description: "Serb Tracker Client"
publish_to: 'none'
version: 1.0.1+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.2.2
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  path_provider: ^2.1.4
  flutter_background_geolocation: ^5.1.2
  package_info_plus: ^9.0.1
  shared_preferences: ^2.5.5
  firebase_core: ^4.8.0
  firebase_messaging: ^16.2.1
  firebase_analytics: ^12.4.0
  firebase_crashlytics: ^5.2.1
  quick_actions: ^1.1.0
  rate_my_app: ^2.4.0
  shared_preferences_android: ^2.4.23
  wakelock_partial_android: ^1.0.1
  flutter_secure_storage: ^10.2.0
  app_links: ^7.0.0
  app_settings: ^7.0.0
  upgrader: ^12.5.0
  new_version_plus: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/app_icon.png
